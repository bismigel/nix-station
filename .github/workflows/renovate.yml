name: Renovate

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the weekly schedule and open PRs now"
        type: boolean
        default: false
  schedule:
    # Monday 09:00 UTC = Monday 05:00 America/Toronto — inside the "before 6am
    # Monday" window in renovate.json.
    - cron: "0 9 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/renovate.yml"
      - "renovate.json"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_SCHEDULE: ${{ inputs.force && 'at any time' || 'before 6am on monday' }}
          LOG_LEVEL: info
